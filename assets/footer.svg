<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 104" width="900" height="104" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#38BDF8" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="102" rx="12" fill="#080D16" stroke="url(#edge)" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="898" height="102" rx="12" fill="url(#grid)"/>

  <g transform="translate(60 52)">
    <g><path d="M 24 0 A 24 24 0 1 1 -8.2 -22.6" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.4s" repeatCount="indefinite"/></g>
    <g><path d="M 13.6 11.4 A 17.8 17.8 0 1 1 8.9 -15.4" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="360;0" dur="2.6s" repeatCount="indefinite"/></g>
    <g><path d="M 11.1 2 A 11.3 11.3 0 1 1 -10.6 -3.9" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="0;360" dur="2s" repeatCount="indefinite"/></g>
    <circle r="4.5" fill="#A78BFA"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle></g>
  <text x="450" y="48" text-anchor="middle" font-size="11" letter-spacing="3.4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C8FA6">THANKS FOR SCROLLING</text>
  <text x="450" y="70" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#4A5A6E"><tspan fill="#38BDF8">$</tspan> exit</text>
  <rect x="482" y="60" width="7" height="12" fill="#38BDF8"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <g transform="translate(840 52)"><circle r="6" fill="none" stroke="#38BDF8" stroke-width="1.4">
      <animate attributeName="r" values="6;24" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle><circle r="6" fill="none" stroke="#38BDF8" stroke-width="1.4">
      <animate attributeName="r" values="6;24" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle><circle r="6" fill="none" stroke="#38BDF8" stroke-width="1.4">
      <animate attributeName="r" values="6;24" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5.5" fill="#A78BFA"><animate attributeName="r" values="5.5;7;5.5" dur="2.4s" repeatCount="indefinite"/></circle></g>
